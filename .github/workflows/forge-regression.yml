name: Forge Regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  forge-regression:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate PowerShell
        shell: pwsh
        run: |
          $PSVersionTable.PSVersion

      - name: Run Forge regression
        shell: pwsh
        run: ./scripts/run-forge-regression.ps1

      - name: Run Worktree isolation
        shell: pwsh
        run: ./scripts/run-worktree-isolation-test.ps1
